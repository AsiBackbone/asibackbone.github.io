name: Landing site validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Catches a compatibility-matrix update that has not been rendered into index.html yet.
  schedule:
    - cron: '27 9 * * 1'

permissions:
  contents: read

jobs:
  validate:
    name: Validate landing site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate HTML and crawler metadata
        shell: pwsh
        run: ./scripts/Test-LandingSite.ps1

      - name: Validate outreach plan
        shell: pwsh
        run: ./scripts/Test-OutreachPlan.ps1

      - name: Validate release-summary tooling
        shell: pwsh
        run: ./scripts/Test-ReleaseSummary.ps1 -SelfTest

      # Reads the organization compatibility manifest from AsiBackbone/.github main. A failure after the matrix
      # changes means index.html needs ./scripts/Test-ReleaseSummary.ps1 -Update.
      - name: Validate release summary against the compatibility matrix
        shell: pwsh
        run: ./scripts/Test-ReleaseSummary.ps1
